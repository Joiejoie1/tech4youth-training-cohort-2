# Blocks any pull request that changes files outside the author's own folder.
#
# Uses pull_request_target so it always runs the copy of this file on `main`.
# A student cannot switch the check off by editing it in their PR.
# It never checks out or runs student code: it only reads the list of changed files.
name: folder-guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write   # to post a friendly comment explaining a failure
  issues: write

jobs:
  folder-guard:
    name: folder-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (roster + instructor list)
        uses: actions/checkout@v4

      - name: Check changed files
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          author_lc=$(echo "$AUTHOR" | tr '[:upper:]' '[:lower:]')
          MARK='<!-- folder-guard-bot -->'

          # Post (or update) one plain-English comment so students don't need to read logs.
          say() {
            existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -n1 || true)
            body="$MARK
          $1"
            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null || true
            else
              gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null || true
            fi
          }
          fail() { echo "::error::$1"; say "$2"; exit 1; }

          # Facilitators may change anything.
          if grep -v '^#' .github/instructors.txt | tr '[:upper:]' '[:lower:]' | grep -qx "$author_lc"; then
            echo "✅ $AUTHOR is a facilitator, so all changes are allowed."
            exit 0
          fi

          # Find this student's folder in roster.csv (columns: id,first,last_initial,github,folder)
          FOLDER=$(awk -F, -v u="$author_lc" 'NR>1 && $0 !~ /^#/ { g=tolower($4); gsub(/[ \r]/,"",g); f=$5; gsub(/[ \r]/,"",f); if (g==u) print f }' roster.csv | head -n1)

          if [ -z "$FOLDER" ]; then
            fail "GitHub user '$AUTHOR' is not in roster.csv yet." \
          "### 🤖 Not on the class list yet
          Hi @$AUTHOR! Your GitHub username is not on the class list yet, so I can't check your work.

          **What to do:** tell your facilitator your GitHub username. Once they add it, they will re-run this check. You don't need to do anything else."
          fi

          # Every changed path, plus the old path of any renamed or moved file.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt

          BAD=$(grep -v "^students/$FOLDER/" changed.txt || true)

          if [ -n "$BAD" ]; then
            LIST=$(echo "$BAD" | sed 's/^/- `/; s/$/`/')
            fail "You can only change files inside students/$FOLDER/" \
          "### 🤖 A file is in the wrong place
          Hi @$AUTHOR! Your files must be inside **your own folder**:

          \`students/$FOLDER/\`

          These files are outside it:
          $LIST

          **Easiest fix:** close this pull request (button at the bottom), then open your folder link below and upload again from there:
          https://github.com/$GITHUB_REPOSITORY/tree/main/students/$FOLDER

          Stuck? Write a comment here and your facilitator will help. 🙂"
          fi

          echo "✅ All $(wc -l < changed.txt | tr -d ' ') changed file(s) are inside students/$FOLDER/"
          # Always confirm receipt, so every student gets a comment. One comment per PR, updated on each push.
          HEAD="### 🤖 ✅ Received!"
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' 2>/dev/null | grep -qF "$MARK"; then
            HEAD="### 🤖 ✅ Fixed! Received."
          fi
          LIST=$(sed 's/^/- `/; s/$/`/' changed.txt)
          TIP=""
          if grep -v "/README.md$" changed.txt | grep -vqE "/week-0[1-8]/(lab|homework)/"; then
            TIP="
          💡 **Tip:** lab work goes in \`week-0X/lab/\` and homework in \`week-0X/homework/\`. Your facilitator may ask you to move a file."
          fi
          say "$HEAD
          Thank you @$AUTHOR! Your files are in your own folder, \`students/$FOLDER/\`:
          $LIST
          $TIP

          **What happens next:** your facilitator will review your work and comment here.
          - Want to add or change something? Upload to the **same branch** and this pull request updates by itself.
          - Questions? Write a comment here. 🙂"
